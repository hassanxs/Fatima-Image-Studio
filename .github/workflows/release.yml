# Pushing a tag like v1.0.0 builds the installer from that exact commit and publishes it as a release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # manual run: builds the installer as a downloadable artifact, no release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip pillow
          choco install innosetup --no-progress -y

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = (Select-String -Path studio\__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} doesn't match __version__ $v" }

      - name: Build installer
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging\build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem dist\*.exe | Select-Object -First 1
          $sha = (Get-Content "$($exe.FullName).sha256").Split(" ")[0]
          $notes = @"
          Download **$($exe.Name)** below and run it. The app downloads the engine and a model for your PC on its Setup page.

          SHA-256: ``$sha``

          Built by GitHub Actions from this tag's source. Not code-signed yet: if SmartScreen warns, choose More info → Run anyway.

          [Code signing policy](https://github.com/${{ github.repository }}#code-signing-policy) · [Privacy](https://github.com/${{ github.repository }}#privacy)
          "@
          gh release create "${{ github.ref_name }}" dist\* --title "Fatima Image Studio ${{ github.ref_name }}" --notes "$notes" --generate-notes
